<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>每日学习 · Daily Learning</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="header-top">
      <div class="brand">
        <span class="brand-icon">📚</span>
        <div class="brand-text">
          <h1>每日学习</h1>
          <p class="brand-date" id="header-date">--</p>
        </div>
      </div>
      <button class="icon-btn" id="refresh-btn" title="刷新">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      </button>
    </div>
    <!-- 分类 tab 栏 -->
    <nav class="tabs" id="tabs">
      <div class="tabs-scroll" id="tabs-scroll"></div>
    </nav>
  </header>

  <main class="content" id="content">
    <!-- 分类卡片区（JS 渲染） -->
  </main>

  <footer class="footer">
    <p>每日学习 · 碎片时间，补知识地图的一格</p>
    <p class="footer-archive" id="archive-links"></p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
